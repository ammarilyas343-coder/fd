<style>
  :root{
    --amber:#F7B32B; --amber-hi:#FFD166; --ink:#08090D;
    --panel:rgba(255,255,255,.028); --line:rgba(255,255,255,.07);
    --green:#34D399; --red:#FB7185; --sky:#38BDF8;
  }
  html{scrollbar-color:rgba(255,255,255,.14) transparent}
  body{background:var(--ink);font-family:'Inter',sans-serif}
  .font-display{font-family:'Space Grotesk',sans-serif}
  .num{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;border:2px solid var(--ink)}
  ::-webkit-scrollbar-track{background:transparent}
  *::selection{background:rgba(247,179,43,.28);color:#fff}

  .bg-stage{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(247,179,43,.075), transparent 60%),
      radial-gradient(800px 520px at 95% 105%, rgba(56,189,248,.055), transparent 60%),
      radial-gradient(600px 400px at 70% -10%, rgba(167,139,250,.05), transparent 60%);
  }
  .bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:26px 26px;
    -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 20%, black 30%, transparent 100%);
            mask-image:radial-gradient(ellipse 90% 70% at 50% 20%, black 30%, transparent 100%);
  }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(8px)}
  .panel-hd{border-bottom:1px solid var(--line)}

  .nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:#8b93a3;font-weight:500;font-size:13.5px;letter-spacing:.01em;cursor:pointer;transition:all .2s cubic-bezier(.22,1,.36,1);border:1px solid transparent;white-space:nowrap}
  .nav-item:hover{color:#e6e9f0;background:rgba(255,255,255,.04)}
  .nav-item.active{color:var(--amber);background:rgba(247,179,43,.09);border-color:rgba(247,179,43,.22)}

<script>
/* ============================================================
   STARTUP WARS — MANAGER CONSOLE
   Paper-first event. This console handles data entry + math only.
   ============================================================ */

// ---------------- Icon helper ----------------
function icons(){ try{ if(window.lucide) lucide.createIcons(); }catch(e){} }

// ---------------- Formatting ----------------
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMoney = n => (n<-0.5?'-$':'$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtNum = n => Math.round(n).toLocaleString('en-US');
const fmtPct = n => (n*100).toFixed(1)+'%';
const fmtDelta = n => (n>=0?'+$':'-$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const plCls = n => n>=0 ? 'text-emerald-400' : 'text-rose-400';

// ---------------- Static data ----------------
const EVENTS = [
  { id:'stable',    name:'Steady Market',       icon:'equal',        kind:'neutral', tag:'No modifiers',   desc:'Business as usual. Base demand, standard costs for everyone.',          mods:{demand:1,   cost:1,   mkt:1,   rd:1, grant:0} },
  { id:'boom',      name:'Economic Boom',        icon:'trending-up',  kind:'good',    tag:'Demand +20%',   desc:'Consumer confidence surges. Total market demand rises by 20%.',          mods:{demand:1.2, cost:1,   mkt:1,   rd:1, grant:0} },
  { id:'recession', name:'Recession Fears',      icon:'trending-down',kind:'bad',     tag:'Demand −15%',   desc:'Customers tighten their wallets. Total market demand drops 15%.',        mods:{demand:0.85,cost:1,   mkt:1,   rd:1, grant:0} },
  { id:'supply',    name:'Supply Chain Shock',   icon:'truck',        kind:'bad',     tag:'Unit cost +18%',desc:'Logistics gridlock pushes production costs up for every team.',          mods:{demand:1,   cost:1.18,mkt:1,   rd:1, grant:0} },
  { id:'viral',     name:'Viral Trend',          icon:'megaphone',    kind:'good',    tag:'Ads ×1.5 pull', desc:'A social media wave amplifies every marketing dollar spent this round.', mods:{demand:1,   cost:1,   mkt:1.5, rd:1, grant:0} },
  { id:'breakthrough',name:'R&D Breakthrough',   icon:'lightbulb',    kind:'good',    tag:'R&D ×2 effect', desc:'Open research findings double the impact of all R&D investment.',        mods:{demand:1,   cost:1,   mkt:1,   rd:2, grant:0} },
  { id:'glut',      name:'Material Surplus',     icon:'boxes',        kind:'good',    tag:'Unit cost −12%',desc:'A raw-material glut slashes production costs by 12% this round.',        mods:{demand:1,   cost:0.88,mkt:1,   rd:1, grant:0} },
  { id:'subsidy',   name:'Govt. Subsidy',        icon:'landmark',     kind:'good',    tag:'+$8,000 grant', desc:'Innovation grant: every team receives a one-time $8,000 injection.',     mods:{demand:1,   cost:1,   mkt:1,   rd:1, grant:8000} },
  { id:'competitor',name:'Global Rival Enters',  icon:'earth',        kind:'bad',     tag:'Demand −10%',   desc:'An overseas giant launches and steals attention. Demand falls 10%.',     mods:{demand:0.9, cost:1,   mkt:1,   rd:1, grant:0} },
];
const evById = id => EVENTS.find(e=>e.id===id) || EVENTS[0];

const PALETTE = ['#F7B32B','#38BDF8','#A78BFA','#FB7185','#34D399','#F472B6','#FB923C','#22D3EE','#BEF264','#F87171','#818CF8','#FACC15'];

const DEFAULTS = {
  config:{ startingCash:60000, baseUnitCost:42, fixedOverhead:2500, demandPerTeam:250, growth:0.07 },
  decision:{ price:100, units:250, mkt:3000, rd:1500 },
};
const MAX_ROUNDS = 20;

// ---------------- State ----------------
let state = null;
const LS_KEY = 'startup-wars-v1';

function freshStats(cfg){ return { cash:cfg.startingCash, quality:0, reputation:1, cumProfit:0 }; }
function newTeam(name, colorIdx, cfg){
  return { id:'t'+Math.random().toString(36).slice(2,9), name, color:PALETTE[colorIdx%PALETTE.length],
           stats:freshStats(cfg), history:{ cash:[], profit:[], share:[] } };
}

function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || s.version!==1 || !Array.isArray(s.teams)) return null;
    return s;
  }catch(e){ return null; }
}

function seedSample(){
  const cfg = JSON.parse(JSON.stringify(DEFAULTS.config));
  const s = {
    version:1, config:cfg, rounds:[],
    ui:{ view:'dashboard', selectedEvent:'stable' },
    teams:[
      newTeam('Nova Ventures',0,cfg), newTeam('ByteForge Labs',1,cfg), newTeam('Quantum Hive',2,cfg),
      newTeam('Ember & Oak',3,cfg),   newTeam('Atlas Motion',4,cfg),   newTeam('Zenith Republic',5,cfg),
    ]
  };
  const T = s.teams.map(t=>t.id);
  const E = {};
  const mk = (price,units,mkt,rd)=>({price,units,mkt,rd});
  E[1] = {}; E[1][T[0]]=mk(100,250,3000,2000); E[1][T[1]]=mk(118,230,5000,4500); E[1][T[2]]=mk(95,280,2500,1000);
  E[1][T[3]]=mk(108,240,4000,2500); E[1][T[4]]=mk(90,300,1500,0); E[1][T[5]]=mk(112,220,6000,3500);
  E[2] = {}; E[2][T[0]]=mk(105,270,4000,2000); E[2][T[1]]=mk(120,250,6000,5000); E[2][T[2]]=mk(98,320,3000,1500);
  E[2][T[3]]=mk(110,260,4500,3000); E[2][T[4]]=mk(92,340,2000,0); E[2][T[5]]=mk(115,240,7000,4000);
  state = s;
  processRound(E[1],'stable');
  processRound(E[2],'boom');
  save();
}

// ---------------- Simulation engine ----------------
function marketSize(roundNum, ev, cfg, teamCount){
  return Math.round(teamCount * cfg.demandPerTeam * Math.pow(1+cfg.growth, roundNum-1) * ev.mods.demand);
}

function processRound(entries, eventId){
  const cfg = state.config, ev = evById(eventId);
  const teams = state.teams.filter(t=>entries[t.id]);
  if(teams.length===0) return null;
  const roundNum = state.rounds.length + 1;
  const mkt = marketSize(roundNum, ev, cfg, teams.length);
  const avgPrice = teams.reduce((a,t)=>a+entries[t.id].price,0)/teams.length;

  // Appeal scores
  let sumAppeal = 0; const appeal = {};
  teams.forEach(t=>{
    const e = entries[t.id], st = t.stats;
    const priceFactor = Math.pow(avgPrice/e.price, 1.5);
    const mktFactor   = 1 + (e.mkt/3500) * ev.mods.mkt;
    const qualFactor  = 1 + st.quality/50;
    const a = Math.max(0.05, priceFactor * mktFactor * qualFactor * st.reputation);
    appeal[t.id]=a; sumAppeal+=a;
  });

  const results = {};
  let totalSold=0, totalRevenue=0, totalCosts=0, totalProfit=0;
  teams.forEach(t=>{
    const e = entries[t.id], st = t.stats;
    const demand   = mkt * appeal[t.id]/sumAppeal;
    const sold     = Math.min(demand, e.units);
    const revenue  = sold * e.price;
    const techCut  = Math.min(st.quality*0.0035, 0.20);
    const unitCost = cfg.baseUnitCost * ev.mods.cost * (1 - techCut);
    const cogs     = e.units * unitCost;                       // pay for everything produced
    const costs    = cogs + e.mkt + e.rd + cfg.fixedOverhead;
    const profit   = revenue - costs + ev.mods.grant;
    const fulfill  = demand>0 ? sold/demand : 1;
    const newQual  = st.quality + (e.rd/1500)*ev.mods.rd;
    const newRep   = clamp(st.reputation + (fulfill-0.8)*0.2, 0.6, 1.35);

    results[t.id] = {
      name:t.name, color:t.color,
      price:e.price, units:e.units, mkt:e.mkt, rd:e.rd,
      demand, sold, unmet:Math.max(0,demand-sold), revenue, unitCost, cogs,
      overhead:cfg.fixedOverhead, costs, grant:ev.mods.grant, profit,
      cash:st.cash+profit, qualityGain:newQual-st.quality, reputation:newRep, fulfill, share:0
    };
  });
  teams.forEach(t=>{ totalSold+=results[t.id].sold; totalRevenue+=results[t.id].revenue; totalCosts+=results[t.id].costs; totalProfit+=results[t.id].profit; });
  teams.forEach(t=>{ results[t.id].share = totalSold>0 ? results[t.id].sold/totalSold : 0; });

  // apply mutation
  teams.forEach(t=>{
    const r = results[t.id];
    t.stats.cash = r.cash; t.stats.cumProfit += r.profit;
    t.stats.quality += r.qualityGain; t.stats.reputation = r.reputation;
    t.history.cash.push(r.cash); t.history.profit.push(r.profit); t.history.share.push(r.share);
  });

  // ranks
  const sorted = [...state.teams].sort((a,b)=>b.stats.cash-a.stats.cash);
  const rankMap = {}; sorted.forEach((t,i)=>rankMap[t.id]=i+1);

  const round = { n:roundNum, eventId, marketSize:mkt, avgPrice, entries:JSON.parse(JSON.stringify(entries)),
                  results, rankMap, totalSold, totalRevenue, totalCosts, totalProfit, ts:Date.now() };
  state.rounds.push(round);
  save();
  return round;
}

// ---------------- Ranking helpers ----------------
function rankedTeams(){
  return [...state.teams].sort((a,b)=> b.stats.cash - a.stats.cash || b.stats.cumProfit - a.stats.cumProfit);
}
function lastRankMap(){
  if(state.rounds.length<2) return null;
  return state.rounds[state.rounds.length-2].rankMap;
}

// ---------------- SVG sparkline ----------------
function spark(values, w, h, color){
  if(!values || values.length===0) return '<span class="text-zinc-600 text-[11px]">—</span>';
  const min=Math.min(...values), max=Math.max(...values), rng=(max-min)||1;
  const pts = values.map((v,i)=>{
    const x = values.length===1 ? w/2 : (i/(values.length-1))*(w-4)+2;
    const y = h-3-((v-min)/rng)*(h-6);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg width="${w}" height="${h}" class="inline-block align-middle"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="${color}"/></svg>`;
}

// ---------------- Toasts ----------------
function toast(msg, type='ok'){
  const wrap = document.getElementById('toasts');
  const div = document.createElement('div');
  const icon = type==='ok'?'circle-check-big':type==='warn'?'triangle-alert':'info';
  const bar  = type==='ok'?'bg-emerald-400':type==='warn'?'bg-amber-400':'bg-sky-400';
  div.className = 'toast panel flex items-start gap-3 p-3.5 pr-4 shadow-2xl';
  div.innerHTML = `<span class="w-1 self-stretch rounded-full ${bar} shrink-0"></span>
    <i data-lucide="${icon}" class="w-4 h-4 mt-0.5 text-zinc-300 shrink-0"></i>
    <div class="text-[12.5px] text-zinc-200 leading-snug">${msg}</div>`;
  wrap.appendChild(div); icons();
  setTimeout(()=>{ div.style.transition='all .4s'; div.style.opacity='0'; div.style.transform='translateX(20px)'; setTimeout(()=>div.remove(),400); }, 3400);
}

// ---------------- Modal ----------------
function openModal(html, wide){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="fixed inset-0 z-[80] flex items-center justify-center p-4" id="modal-back">
      <div class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
      <div class="relative panel w-full ${wide?'max-w-2xl':'max-w-md'} max-h-[85vh] overflow-y-auto fade-up shadow-2xl">
        ${html}
      </div>
    </div>`;
  document.getElementById('modal-back').addEventListener('click', e=>{ if(e.target.id==='modal-back') closeModal(); });
  icons();
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }
function confirmModal(title, msg, okLabel, onOk, danger){
  openModal(`
    <div class="p-6">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-9 h-9 rounded-xl ${danger?'bg-rose-500/10 text-rose-400':'bg-amber-400/10 text-amber-300'} flex items-center justify-center">
          <i data-lucide="${danger?'triangle-alert':'circle-help'}" class="w-4.5 h-4.5"></i>
        </div>
        <h3 class="font-display font-semibold text-white text-[16px]">${title}</h3>
      </div>
      <p class="text-[13px] text-zinc-400 leading-relaxed mb-5">${msg}</p>
      <div class="flex justify-end gap-2">
        <button class="btn-ghost px-4 py-2 text-[12.5px]" onclick="closeModal()">Cancel</button>

function animateNum(id, target, formatter, dur=900){
  const el = document.getElementById(id); if(!el) return;
  const t0 = performance.now();
  function tick(t){
    const p = clamp((t-t0)/dur,0,1), e = 1-Math.pow(1-p,3);
    el.textContent = formatter(target*e);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

  const n = state.rounds.length;
  if(n===0) return {...DEFAULTS.decision};
  return {...state.rounds[n-1].entries[tid] || DEFAULTS.decision};
}

  document.querySelectorAll('.ev-card').forEach(c=> c.classList.toggle('selected', c.dataset.ev===id));

  const chip = document.getElementById('sel-ev-chip');
  if(chip){ chip.innerHTML = `<i data-lucide="${ev.icon}" class="w-3 h-3"></i>${ev.name}`; icons(); }

function drawRandom(){
  const cards = [...document.querySelectorAll('.ev-card')];
  if(!cards.length) return;
  const final = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  let step = 0; const total = 14;
  (function cycle(){
    cards.forEach(c=>c.classList.remove('flash'));
    const r = cards[Math.floor(Math.random()*cards.length)];
    r.classList.add('flash');
    if(++step < total){ setTimeout(cycle, 55 + step*step*1.6); }
    else setTimeout(()=>{
      cards.forEach(c=>c.classList.remove('flash'));
      selectEvent(final.id);
      const card = document.querySelector(`.ev-card[data-ev="${final.id}"]`);
      if(card) card.scrollIntoView({block:'nearest', behavior:'smooth'});
      toast(`Card drawn: <b>${final.name}</b> — ${final.tag}`,'info');
    }, 420);
  })();
}

function readDecisions(){
  const entries = {}; let ok = true;
  document.querySelectorAll('.dec-inp').forEach(inp=>{
    const v = parseFloat(inp.value);
    const f = inp.dataset.f;
    if(isNaN(v) || v<0 || (f==='price' && v<=0)){ inp.classList.add('invalid'); ok=false; return; }
    (entries[inp.dataset.tid] = entries[inp.dataset.tid] || {})[f] = f==='units' ? Math.round(v) : v;
  });
  return ok ? entries : null;
}

function runRound(){
  if(state.rounds.length>=MAX_ROUNDS) return;
  const entries = readDecisions();
  if(!entries){ toast('Some fields are empty or invalid. Every team needs a price above $0.', 'warn'); return; }
  const btn = document.getElementById('process-btn');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-circle" class="w-4.5 h-4.5 animate-spin"></i>Simulating…';
  icons();
  setTimeout(()=>{
    const round = processRound(entries, state.ui.selectedEvent);
    toast(`<b>Round ${round.n} processed.</b> Market revenue ${fmtMoney(round.totalRevenue)} · ${fmtNum(round.totalSold)} units sold.`, 'ok');
    state.ui.view = 'results'; save(); render();
  }, 650);
}

function toCSV(rows){
  return rows.map(r=> r.map(c=>{ const s=String(c??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(',')).join('\n');
}
function download(name, text){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
const CSV_HEAD = ['Round','Team','Price','Units Produced','Demand','Units Sold','Unmet Demand','Revenue','Production Cost','Marketing','R&D','Overhead','Total Costs','Grant','Profit/Loss','Cash','Market Share %'];
function roundRows(r){
  return Object.entries(r.results).sort((a,b)=>b[1].profit-a[1].profit).map(([tid,x])=>[
    r.n, x.name, x.price.toFixed(2), Math.round(x.units), Math.round(x.demand), Math.round(x.sold), Math.round(x.unmet),
    x.revenue.toFixed(2), x.cogs.toFixed(2), x.mkt.toFixed(2), x.rd.toFixed(2), x.overhead.toFixed(2),
    x.costs.toFixed(2), x.grant.toFixed(2), x.profit.toFixed(2), x.cash.toFixed(2), (x.share*100).toFixed(1)
  ]);
}
function exportRound(n){
  const r = state.rounds.find(x=>x.n===n); if(!r) return;
  download(`startup-wars-round-${n}.csv`, toCSV([CSV_HEAD, ...roundRows(r)]));
  toast(`Round ${n} exported as CSV.`,'ok');
}
function exportAll(){
  if(!state.rounds.length) return;
  const rows = state.rounds.flatMap(roundRows);
  download('startup-wars-all-rounds.csv', toCSV([CSV_HEAD, ...rows]));
  toast('All rounds exported as CSV.','ok');
}

  // bindings

    inp.addEventListener('change', ()=>{
      const t = state.teams.find(x=>x.id===inp.dataset.tid);
      const v = inp.value.trim();
      if(t && v){ t.name = v; save(); toast('Team renamed.','ok'); renderNav(); } else { inp.value = t? t.name : ''; }
    });
  });
  el.querySelectorAll('.remove-team').forEach(b=>{
    b.addEventListener('click', ()=>{
      const t = state.teams.find(x=>x.id===b.dataset.tid); if(!t) return;
      confirmModal('Remove team?', `Remove <b>${esc(t.name)}</b>? Past round reports keep their historical scores, but they will no longer appear in future rounds or standings.`, 'Remove team', ()=>{
        state.teams = state.teams.filter(x=>x.id!==t.id); save(); render(); toast(`<b>${esc(t.name)}</b> removed.`,'ok');
      }, true);
    });
  });
  const addTeam = ()=>{
    const inp = document.getElementById('new-team-name');
    const v = inp.value.trim();
    if(!v){ toast('Enter a team name first.','warn'); inp.focus(); return; }
    if(state.teams.some(t=>t.name.toLowerCase()===v.toLowerCase())){ toast('A team with that name already exists.','warn'); return; }
    state.teams.push(newTeam(v, state.teams.length, state.config));
    save(); render(); toast(`<b>${esc(v)}</b> joined the arena.`,'ok');
  };
  document.getElementById('add-team').onclick = addTeam;
  document.getElementById('new-team-name').addEventListener('keydown', e=>{ if(e.key==='Enter') addTeam(); });

  const cfgBind = (id, key)=>{
    const inp = document.getElementById(id);
    inp.addEventListener('change', ()=>{
      const v = parseFloat(inp.value);
      if(isNaN(v)||v<0){ inp.value = state.config[key]; return; }
      state.config[key] = v; save(); toast('Economics updated for upcoming rounds.','ok');
    });
  };
  cfgBind('cfg-startingCash','startingCash'); cfgBind('cfg-unitCost','baseUnitCost');
  cfgBind('cfg-overhead','fixedOverhead');   cfgBind('cfg-demand','demandPerTeam');

  document.getElementById('reset-rounds').onclick = ()=>{
    confirmModal('Reset event?', 'All processed rounds will be cleared and every team returns to its starting cash. Team list and economics stay as they are.', 'Reset event', ()=>{
      state.rounds = [];
      state.teams.forEach(t=>{ t.stats = freshStats(state.config); t.history = {cash:[],profit:[],share:[]}; });
      save(); render(); toast('Event reset. Ready for Round 1.','ok');
    }, true);
  };
  document.getElementById('load-sample').onclick = ()=>{
    confirmModal('Load sample data?', 'This replaces the current event with the built-in demo: 6 sample teams and 2 processed rounds.', 'Load sample', ()=>{
      seedSample(); render(); toast('Sample event loaded — explore the demo rounds.','ok');
    });
  };
  document.getElementById('wipe-all').onclick = ()=>{
    confirmModal('Wipe everything?', 'Teams, rounds and settings will all be deleted, leaving a completely fresh event. This cannot be undone.', 'Wipe all data', ()=>{
      localStorage.removeItem(LS_KEY);
      state = { version:1, config:JSON.parse(JSON.stringify(DEFAULTS.config)), rounds:[], teams:[], ui:{view:'teams', selectedEvent:'stable'} };
      save(); render(); toast('Fresh event created. Add your teams to begin.','ok');
    }, true);
  };
}

function printSheet(){
  document.body.classList.add('print-sheet');
  const done = ()=>{ document.body.classList.remove('print-sheet'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  setTimeout(done, 900);
}

    </div>
  </div>`;
  setActions('');
